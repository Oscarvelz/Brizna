# Brizna for Android (WebView app, package com.oscarvelz.brizna). Runs only on the `source` branch when android/ changes
# (or by hand); it never touches `main` or GitHub Pages.
# Two jobs:
#  - build: no secrets. Compiles and uploads the unsigned APK artifact (brizna-unsigned-N), exactly like the old
#    no-secrets path. Builds never wait for anyone. versionCode = android/version.txt.
#  - release: needs build, and runs inside the GitHub environment `release`. That environment holds the signing
#    secrets BRIZNA_KS_B64 (base64 of the PKCS12 keystore) and BRIZNA_KS_PASS as ENVIRONMENT secrets and requires
#    Oscarvelz's review (admins cannot bypass), so every run waits for his approval before the key is touched.
#    After approval it signs the artifact with apksigner (alias brizna), verifies the certificate SHA-256 digest
#    (must start 7eae31f1 and end dc0232) and publishes release android-<versionCode> with Brizna.apk.
# If the environment secrets are missing, the release job ends without publishing and the fallback stands: the
# unsigned APK is signed privately with the same key and pushed to the orphan branch `android-signed`
# (Brizna.apk + VERSION=N), whose own workflow publishes release android-N.
# Every update must be signed with that one key or Android refuses it.
name: Brizna for Android
on:
  push:
    branches: [source]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: brizna-android
      cancel-in-progress: false
    outputs:
      n: ${{ steps.ver.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Version
        id: ver
        run: |
          N=$(tr -dc '0-9' < android/version.txt)
          echo "N=$N" >> "$GITHUB_ENV"
          echo "n=$N" >> "$GITHUB_OUTPUT"
      - name: Build (unsigned; signing happens in the release job)
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect
        run: |
          ls -la android/app/build/outputs/apk/release/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk Brizna-unsigned.apk
      - name: Unsigned APK (input for the release job, or signed privately afterwards)
        uses: actions/upload-artifact@v4
        with:
          name: brizna-unsigned-${{ env.N }}
          path: Brizna-unsigned.apk
          retention-days: 14
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: brizna-android-release
      cancel-in-progress: false
    steps:
      - name: Get the unsigned APK from the build job
        uses: actions/download-artifact@v4
        with:
          name: brizna-unsigned-${{ needs.build.outputs.n }}
      - name: Is the key loaded in the environment?
        id: key
        env:
          KS_B64: ${{ secrets.BRIZNA_KS_B64 }}
          KS_PASS: ${{ secrets.BRIZNA_KS_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "have_key=1" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=0" >> "$GITHUB_OUTPUT"
            echo "BRIZNA_KS_B64 / BRIZNA_KS_PASS are not set in the release environment; nothing will be signed or published."
          fi
      - name: Decode the keystore
        if: steps.key.outputs.have_key == '1'
        env:
          KS_B64: ${{ secrets.BRIZNA_KS_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/brizna.p12"
          chmod 600 "$RUNNER_TEMP/brizna.p12"
      - name: Sign with apksigner (alias brizna)
        if: steps.key.outputs.have_key == '1'
        env:
          BRIZNA_KS_PASS: ${{ secrets.BRIZNA_KS_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -c 4 Brizna-unsigned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/brizna.p12" --ks-key-alias brizna \
            --ks-pass env:BRIZNA_KS_PASS --key-pass env:BRIZNA_KS_PASS \
            --out Brizna.apk Brizna-unsigned.apk
          ls -la Brizna.apk
      - name: Verify the signature is the Brizna key
        if: steps.key.outputs.have_key == '1'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          CERTS=$("$BT/apksigner" verify --print-certs Brizna.apk)
          echo "$CERTS"
          DIGEST=$(echo "$CERTS" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: //' | tr -d ' :')
          echo "certificate SHA-256: $DIGEST"
          case "$DIGEST" in
            7eae31f1*dc0232) echo "Matches the Brizna signing key." ;;
            *) echo "ERROR: this is not the Brizna signing key; refusing to publish." ; exit 1 ;;
          esac
      - name: Release
        if: steps.key.outputs.have_key == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ needs.build.outputs.n }}
          target_commitish: ${{ github.sha }}
          name: Brizna para Android ${{ needs.build.outputs.n }}
          body: Instala Brizna.apk en el teléfono. La app abre https://oscarvelz.github.io/Brizna/ con su propio almacenamiento; entra con tu cuenta para traer tus clientes.
          files: Brizna.apk
          make_latest: 'true'
      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/brizna.p12"
